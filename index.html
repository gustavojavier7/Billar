<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozo 3D en perspectiva</title>
    <!-- Comentario de prueba - versión 1.0 -->
    <style>
        :root {
            --fondo: #f5f5f5;
            --azul: #4285f4;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            min-height: 100%;
            background: var(--fondo);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .escena {
            width: min(78vw, 560px);
            aspect-ratio: 1;
        }

        .grilla-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .marco,
        .perspectiva,
        .division-fondo {
            fill: none;
            stroke: var(--azul);
            vector-effect: non-scaling-stroke;
        }

        .marco {
            stroke-width: 3;
        }

        .perspectiva {
            stroke-width: 2;
            opacity: 0.86;
        }

        .division-fondo {
            stroke-width: 2.4;
        }

        .fondo-pozo {
            fill: var(--fondo);
            stroke: var(--azul);
            stroke-width: 3;
            vector-effect: non-scaling-stroke;
        }
    </style>
</head>
<body>
    <main class="escena" aria-label="Pozo tridimensional con fondo dividido para cuatro cubos">
        <svg class="grilla-3d" viewBox="0 0 500 500" role="img" aria-labelledby="titulo descripcion">
            <title id="titulo">Pozo 3D en perspectiva</title>
            <desc id="descripcion">Marcos cuadrados y líneas de fuga convergen hacia un fondo central dividido en cuatro celdas.</desc>

            <!-- Marcos que representan niveles de profundidad -->
            <rect class="marco" x="25" y="25" width="450" height="450" rx="10" />
            <rect class="marco" x="80" y="80" width="340" height="340" rx="8" />
            <rect class="marco" x="130" y="130" width="240" height="240" rx="6" />
            <rect class="marco" x="175" y="175" width="150" height="150" rx="4" />

            <!-- Fondo del pozo: una superficie 2×2 capaz de alojar cuatro cubos -->
            <rect class="fondo-pozo" x="220" y="220" width="60" height="60" rx="2" />
            <line class="division-fondo" x1="250" y1="220" x2="250" y2="280" />
            <line class="division-fondo" x1="220" y1="250" x2="280" y2="250" />

            <!-- Líneas de fuga prolongadas hasta las esquinas del fondo -->
            <line class="perspectiva" x1="25" y1="25" x2="220" y2="220" />
            <line class="perspectiva" x1="475" y1="25" x2="280" y2="220" />
            <line class="perspectiva" x1="475" y1="475" x2="280" y2="280" />
            <line class="perspectiva" x1="25" y1="475" x2="220" y2="280" />

            <!-- Líneas de fuga prolongadas desde los puntos medios -->
            <line class="perspectiva" x1="250" y1="25" x2="250" y2="220" />
            <line class="perspectiva" x1="475" y1="250" x2="280" y2="250" />
            <line class="perspectiva" x1="250" y1="475" x2="250" y2="280" />
            <line class="perspectiva" x1="25" y1="250" x2="220" y2="250" />
        </svg>
    </main>
</body>
</html>
