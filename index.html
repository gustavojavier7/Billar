<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozo 3D paramétrico</title>
    <!-- Comentario de prueba - versión 1.0 -->
    <style>
        :root {
            --fondo: #f5f5f5;
            --azul: #4285f4;
            --texto: #1f2937;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .aplicacion {
            width: min(92vw, 680px);
            display: grid;
            gap: 18px;
        }

        .controles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            padding: 16px;
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(66,133,244,.25);
            border-radius: 12px;
        }

        .control {
            display: grid;
            gap: 7px;
        }

        label {
            font-size: .9rem;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--azul);
            border-radius: 8px;
            background: var(--fondo);
            color: var(--texto);
            font: inherit;
            cursor: pointer;
        }

        .escena {
            width: 100%;
            aspect-ratio: 1;
        }

        .grilla-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .marco,
        .perspectiva,
        .division-fondo,
        .fondo-pozo {
            fill: none;
            stroke: var(--azul);
            vector-effect: non-scaling-stroke;
        }

        .marco { stroke-width: 2.6; }
        .perspectiva { stroke-width: 1.45; opacity: .76; }
        .division-fondo { stroke-width: 1.25; opacity: .9; }
        .fondo-pozo { fill: var(--fondo); stroke-width: 2.8; }

        @media (max-width: 560px) {
            .controles { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="aplicacion">
        <section class="controles" aria-label="Controles de la grilla tridimensional">
            <div class="control">
                <label for="profundidad">Cubos en profundidad: <span id="valorProfundidad">5</span></label>
                <select id="profundidad" aria-label="Cantidad de cubos apilados en profundidad"></select>
            </div>
            <div class="control">
                <label for="cubos">Cubos por lado: <span id="valorCubos">5</span></label>
                <select id="cubos" aria-label="Cantidad de cubos por lado"></select>
            </div>
        </section>

        <section class="escena" aria-label="Pozo tridimensional configurable">
            <svg id="grilla" class="grilla-3d" viewBox="0 0 500 500" role="img" aria-labelledby="titulo descripcion">
                <title id="titulo">Pozo 3D paramétrico</title>
                <desc id="descripcion">La cantidad de cubos en profundidad y la cantidad de cubos por lado pueden modificarse de forma independiente.</desc>
            </svg>
        </section>
    </main>

    <script>
        const NS = 'http://www.w3.org/2000/svg';
        const profundidadSelect = document.getElementById('profundidad');
        const cubosSelect = document.getElementById('cubos');
        const valorProfundidad = document.getElementById('valorProfundidad');
        const valorCubos = document.getElementById('valorCubos');
        const svg = document.getElementById('grilla');

        function cargarOpciones(select, minimo, maximo) {
            for (let valor = minimo; valor <= maximo; valor++) {
                const option = document.createElement('option');
                option.value = valor;
                option.textContent = valor;
                select.appendChild(option);
            }
        }

        function crearElemento(tipo, atributos, clase) {
            const elemento = document.createElementNS(NS, tipo);
            if (clase) elemento.setAttribute('class', clase);
            for (const [nombre, valor] of Object.entries(atributos)) {
                elemento.setAttribute(nombre, valor);
            }
            return elemento;
        }

        function interpolar(inicio, fin, t) {
            return inicio + (fin - inicio) * t;
        }

        function dibujarPozo() {
            const cubosProfundidad = Number(profundidadSelect.value);
            const cubos = Number(cubosSelect.value);
            const cantidadPlanos = cubosProfundidad + 1;

            valorProfundidad.textContent = cubosProfundidad;
            valorCubos.textContent = cubos;

            svg.querySelectorAll('g').forEach(grupo => grupo.remove());

            const grupoPerspectiva = crearElemento('g', {}, 'grupo-perspectiva');
            const grupoMarcos = crearElemento('g', {}, 'grupo-marcos');
            const grupoFondo = crearElemento('g', {}, 'grupo-fondo');

            const exterior = { x: 25, y: 25, size: 450 };
            const fondoSize = 92;
            const fondo = {
                x: (500 - fondoSize) / 2,
                y: (500 - fondoSize) / 2,
                size: fondoSize
            };

            // N cubos apilados requieren N + 1 planos que delimiten sus intervalos.
            for (let nivel = 0; nivel < cantidadPlanos; nivel++) {
                const t = nivel / cubosProfundidad;
                const suavizado = 1 - Math.pow(1 - t, 1.42);
                const x = interpolar(exterior.x, fondo.x, suavizado);
                const y = interpolar(exterior.y, fondo.y, suavizado);
                const size = interpolar(exterior.size, fondo.size, suavizado);
                grupoMarcos.appendChild(crearElemento('rect', {
                    x, y, width: size, height: size,
                    rx: Math.max(1.5, 10 * (1 - suavizado))
                }, nivel === cubosProfundidad ? 'fondo-pozo' : 'marco'));
            }

            for (let i = 0; i <= cubos; i++) {
                const fraccion = i / cubos;
                const exteriorPos = exterior.x + exterior.size * fraccion;
                const fondoPos = fondo.x + fondo.size * fraccion;

                grupoPerspectiva.appendChild(crearElemento('line', {
                    x1: exteriorPos, y1: exterior.y,
                    x2: fondoPos, y2: fondo.y
                }, 'perspectiva'));
                grupoPerspectiva.appendChild(crearElemento('line', {
                    x1: exteriorPos, y1: exterior.y + exterior.size,
                    x2: fondoPos, y2: fondo.y + fondo.size
                }, 'perspectiva'));
                grupoPerspectiva.appendChild(crearElemento('line', {
                    x1: exterior.x, y1: exteriorPos,
                    x2: fondo.x, y2: fondoPos
                }, 'perspectiva'));
                grupoPerspectiva.appendChild(crearElemento('line', {
                    x1: exterior.x + exterior.size, y1: exteriorPos,
                    x2: fondo.x + fondo.size, y2: fondoPos
                }, 'perspectiva'));
            }

            for (let i = 1; i < cubos; i++) {
                const posicion = fondo.x + fondo.size * (i / cubos);
                grupoFondo.appendChild(crearElemento('line', {
                    x1: posicion, y1: fondo.y,
                    x2: posicion, y2: fondo.y + fondo.size
                }, 'division-fondo'));
                grupoFondo.appendChild(crearElemento('line', {
                    x1: fondo.x, y1: posicion,
                    x2: fondo.x + fondo.size, y2: posicion
                }, 'division-fondo'));
            }

            svg.append(grupoPerspectiva, grupoMarcos, grupoFondo);
        }

        cargarOpciones(profundidadSelect, 5, 12);
        cargarOpciones(cubosSelect, 5, 9);
        profundidadSelect.value = '5';
        cubosSelect.value = '5';
        profundidadSelect.addEventListener('change', dibujarPozo);
        cubosSelect.addEventListener('change', dibujarPozo);
        dibujarPozo();
    </script>
</body>
</html>
