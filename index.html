<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilla 3D en perspectiva</title>
    <!-- Comentario de prueba - versión 1.0 -->
    <style>
        :root {
            --fondo: #f5f5f5;
            --azul: #4285f4;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            min-height: 100%;
            background: var(--fondo);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .escena {
            width: min(78vw, 520px);
            aspect-ratio: 1;
        }

        .grilla-3d {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .marco,
        .perspectiva {
            fill: none;
            stroke: var(--azul);
            vector-effect: non-scaling-stroke;
        }

        .marco {
            stroke-width: 3;
        }

        .perspectiva {
            stroke-width: 2;
            opacity: 0.82;
        }
    </style>
</head>
<body>
    <main class="escena" aria-label="Ilusión de grilla tridimensional con cuadrados concéntricos">
        <svg class="grilla-3d" viewBox="0 0 500 500" role="img" aria-labelledby="titulo descripcion">
            <title id="titulo">Grilla 3D en perspectiva</title>
            <desc id="descripcion">Cuadrados concéntricos unidos por líneas que convergen hacia el centro.</desc>

            <!-- Marcos concéntricos -->
            <rect class="marco" x="25" y="25" width="450" height="450" rx="10" />
            <rect class="marco" x="80" y="80" width="340" height="340" rx="8" />
            <rect class="marco" x="130" y="130" width="240" height="240" rx="6" />
            <rect class="marco" x="175" y="175" width="150" height="150" rx="4" />
            <rect class="marco" x="212" y="212" width="76" height="76" rx="2" />

            <!-- Líneas de perspectiva desde las esquinas -->
            <line class="perspectiva" x1="25" y1="25" x2="212" y2="212" />
            <line class="perspectiva" x1="475" y1="25" x2="288" y2="212" />
            <line class="perspectiva" x1="475" y1="475" x2="288" y2="288" />
            <line class="perspectiva" x1="25" y1="475" x2="212" y2="288" />

            <!-- Líneas de perspectiva desde los puntos medios -->
            <line class="perspectiva" x1="250" y1="25" x2="250" y2="212" />
            <line class="perspectiva" x1="475" y1="250" x2="288" y2="250" />
            <line class="perspectiva" x1="250" y1="475" x2="250" y2="288" />
            <line class="perspectiva" x1="25" y1="250" x2="212" y2="250" />
        </svg>
    </main>
</body>
</html>
